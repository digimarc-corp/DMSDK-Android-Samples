apply plugin: 'com.android.application'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
                url "https://dmrc.io/packages/android"
        }
    }
}


android {
    namespace 'com.digimarc.dmsdemo'

    defaultConfig {
        applicationId "com.digimarc.dmsdemo"
        minSdkVersion 24
        compileSdk 34
        targetSdkVersion 34

        vectorDrawables.useSupportLibrary = true

        // Filter supported architectures for native components. Unwanted architectures can be
        // removed here to reduce application footprint.
        ndk {
            abiFilters 'armeabi-v7a', 'x86', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            signingConfig
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    flavorDimensions += "mode"
    productFlavors {
        internal {
            dimension "mode"
            matchingFallbacks = ["internal"]
        }
    }

    lint {
        abortOnError false
    }
}


dependencies {
    implementation("com.digimarc.mobile:dms:4.0.1")

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

}
